<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MyMood</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0C0C0F;
  --bg2: #0F0F16;
  --bg3: #13131C;
  --border: #1A1A26;
  --border2: #222230;
  --text: #EEEEE8;
  --text2: #888899;
  --text3: #44445A;
  --accent: #FF6B35;
  --accent2: #FF3D6B;
  --mood: #C026D3;
  --radius: 20px;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* Phone wrapper — simulates mobile on desktop */
.app-shell {
  max-width: 390px;
  min-height: 100dvh;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Screens ── */
.screen {
  display: none;
  flex-direction: column;
  min-height: 100dvh;
  padding: 0;
  animation: fadeIn 0.3s ease;
}
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ══════════════════════════════
   SPLASH
══════════════════════════════ */
#screen-splash {
  align-items: center;
  justify-content: flex-end;
  padding: 0 32px 52px;
  position: relative;
  background: var(--bg);
}

.splash-glow {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; height: 60%;
  background: radial-gradient(ellipse 320px 320px at 50% 32%, rgba(192,38,211,0.18) 0%, rgba(255,107,53,0.08) 50%, transparent 70%);
  pointer-events: none;
}

.splash-center {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 62%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

.splash-icon {
  width: 130px; height: 130px;
  margin-bottom: 24px;
  animation: pulse 3.5s ease-in-out infinite;
  filter: drop-shadow(0 0 24px rgba(192,38,211,0.4)) drop-shadow(0 0 48px rgba(255,107,53,0.2));
}
@keyframes pulse {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(192,38,211,0.35)) drop-shadow(0 0 40px rgba(255,107,53,0.15)); }
  50% { transform: scale(1.04); filter: drop-shadow(0 0 36px rgba(192,38,211,0.55)) drop-shadow(0 0 64px rgba(255,107,53,0.3)); }
}

.splash-logo {
  font-family: 'Syne', sans-serif;
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 0;
}
.splash-logo .my { color: #EEEEE8; }
.splash-logo .m2 { color: #FF3D8B; }
.splash-logo .o1 { color: #FF6B35; }
.splash-logo .o2 { color: #FFB830; }
.splash-logo .d  { color: #38BDF8; }

.splash-tag {
  font-size: 13px;
  color: var(--text3);
  font-weight: 400;
  text-align: center;
  line-height: 1.6;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.splash-actions { width: 100%; display: flex; flex-direction: column; gap: 12px; }

.btn {
  width: 100%;
  padding: 17px 20px;
  border-radius: 18px;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: opacity 0.2s, transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { opacity: 0.9; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text3);
  font-size: 14px;
  padding: 14px 20px;
}

/* ══════════════════════════════
   QUESTIONS
══════════════════════════════ */
#screen-quiz {
  padding: 0;
  background: var(--bg2);
}

.quiz-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 56px 28px 36px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.btn-back {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 18px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.skip-btn {
  font-size: 13px;
  color: var(--text3);
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
}

.progress-wrap { margin-bottom: 36px; }
.progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-label {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.06em;
}

.q-num {
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.q-text {
  font-family: 'Syne', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 32px;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.opt-btn {
  padding: 16px 18px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--bg3);
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  text-align: left;
  width: 100%;
}
.opt-btn:hover { border-color: var(--border2); }
.opt-btn.selected {
  border-color: var(--accent);
  background: rgba(255,107,53,0.07);
}

.opt-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: #18181F;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 20px;
  flex-shrink: 0;
}
.opt-btn.selected .opt-icon {
  background: rgba(255,107,53,0.12);
  border-color: rgba(255,107,53,0.25);
}

.opt-info { flex: 1; }
.opt-label {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  display: block;
  margin-bottom: 2px;
}
.opt-desc {
  font-size: 12px;
  color: var(--text3);
  font-weight: 300;
}
.opt-btn.selected .opt-label { color: #FF8B5A; }

.opt-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--border2);
  display: grid;
  place-items: center;
  font-size: 11px;
  color: transparent;
  flex-shrink: 0;
  transition: all 0.2s;
}
.opt-btn.selected .opt-check {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.quiz-footer { padding-top: 24px; }

/* ══════════════════════════════
   LOADING
══════════════════════════════ */
#screen-loading {
  align-items: center;
  justify-content: center;
  background: var(--bg);
  gap: 20px;
}

.loading-orb {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: conic-gradient(from 180deg, #FF6B35, #FF3D6B, #C026D3, #7C3AED, #FF6B35);
  animation: spin 1.5s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--text2);
  letter-spacing: -0.01em;
}
.loading-sub {
  font-size: 13px;
  color: var(--text3);
  font-weight: 300;
}

/* ══════════════════════════════
   RESULTS
══════════════════════════════ */
#screen-results {
  background: var(--bg);
  overflow-y: auto;
  padding-bottom: 32px;
}

.results-header {
  padding: 52px 28px 20px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
  border-bottom: 1px solid var(--border);
}

.res-eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mood);
  margin-bottom: 6px;
}

.res-mood-name {
  font-family: 'Syne', sans-serif;
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-bottom: 4px;
  line-height: 1.1;
}

.res-subtitle {
  font-size: 13px;
  color: var(--text3);
  font-weight: 300;
  margin-bottom: 12px;
}

.mood-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.mood-tag {
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid rgba(192,38,211,0.2);
  background: rgba(192,38,211,0.07);
  font-size: 11px;
  color: var(--mood);
  font-weight: 400;
}

.res-tabs {
  display: flex;
  padding: 0 28px;
  gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.res-tab {
  padding: 14px 0;
  margin-right: 24px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text3);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: 'DM Sans', sans-serif;
  transition: color 0.2s;
}
.res-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.cards-section {
  padding: 20px 28px 0;
}

.section-title {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 14px;
}

.rec-card {
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg3);
  overflow: hidden;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.rec-card:hover { border-color: var(--border2); }

.rec-card-top {
  display: flex;
  gap: 0;
}

.rec-poster {
  width: 72px;
  background: #18182A;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  min-height: 100px;
  position: relative;
  overflow: hidden;
}

.rec-poster img {
  width: 100%; height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
}

.rec-body { padding: 14px 16px; flex: 1; min-width: 0; }

.rec-type {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 4px;
}

.rec-title {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rec-meta {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 8px;
}

.rec-why {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.55;
  font-style: italic;
  font-weight: 300;
}

.rec-card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 14px;
  border-top: 1px solid var(--border);
  gap: 8px;
}

.platform-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex: 1;
}

.platform-badge {
  font-size: 11px;
  color: var(--text2);
  background: #0A0A14;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 10px;
  white-space: nowrap;
}

.platform-badge.loading-badge {
  color: var(--text3);
  font-style: italic;
}

.btn-watch {
  padding: 9px 16px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: white;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: opacity 0.2s;
}
.btn-watch:hover { opacity: 0.85; }

.results-footer {
  padding: 8px 28px 0;
}

.btn-regen {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border2);
  border-radius: 16px;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text3);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-regen:hover { background: var(--bg3); color: var(--text2); }

.btn-restart {
  width: 100%;
  padding: 12px;
  border: none;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text3);
  cursor: pointer;
  margin-top: 8px;
}

.error-msg {
  padding: 12px 16px;
  background: rgba(255,61,107,0.08);
  border: 1px solid rgba(255,61,107,0.2);
  border-radius: 12px;
  font-size: 13px;
  color: #FF3D6B;
  margin: 16px 28px;
}

/* Skeleton loader */
.skeleton {
  background: linear-gradient(90deg, var(--bg3) 25%, #1A1A26 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 8px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Desktop centering */
@media (min-width: 600px) {
  body { display: flex; align-items: flex-start; justify-content: center; padding: 24px 0 48px; }
  .app-shell {
    border-radius: 44px;
    border: 1.5px solid var(--border);
    min-height: 820px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  #screen-results { border-radius: 0 0 42px 42px; }
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- ── SPLASH ── -->
  <div id="screen-splash" class="screen active">
    <div class="splash-glow"></div>
    <div class="splash-center">
      <!-- Logo SVG — cara + claqueta estilo logo 2 -->
      <svg class="splash-icon" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="35%" stop-color="#A855F7"/>
            <stop offset="65%" stop-color="#FF3D8B"/>
            <stop offset="100%" stop-color="#FFB830"/>
          </linearGradient>
          <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C026D3"/>
            <stop offset="50%" stop-color="#FF3D8B"/>
            <stop offset="100%" stop-color="#FFB830"/>
          </linearGradient>
          <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7C3AED"/>
            <stop offset="50%" stop-color="#FF3D8B"/>
            <stop offset="100%" stop-color="#FFB830"/>
          </linearGradient>
        </defs>
        <!-- Burbuja / cara base -->
        <path d="M20 30 Q20 14 36 14 L94 14 Q110 14 110 30 L110 82 Q110 98 94 98 L72 98 L65 114 L58 98 L36 98 Q20 98 20 82 Z" fill="url(#g1)" opacity="0.95"/>
        <!-- Brillo interno -->
        <path d="M28 30 Q28 22 36 22 L94 22 Q102 22 102 30 L102 55 Q70 72 28 52 Z" fill="white" opacity="0.07"/>
        <!-- Claqueta — cuerpo -->
        <rect x="34" y="8" width="62" height="20" rx="5" fill="url(#g2)" opacity="0.95"/>
        <!-- Claqueta — rayas -->
        <rect x="34" y="8" width="9" height="20" rx="0" fill="white" opacity="0.25"/>
        <rect x="52" y="8" width="9" height="20" fill="white" opacity="0.25"/>
        <rect x="70" y="8" width="9" height="20" fill="white" opacity="0.25"/>
        <rect x="88" y="8" width="8" height="20" rx="0" fill="white" opacity="0.25"/>
        <!-- Claqueta — bisagra top -->
        <rect x="28" y="6" width="74" height="7" rx="3" fill="url(#g3)" opacity="0.9"/>
        <!-- Play button -->
        <circle cx="65" cy="54" r="14" fill="black" opacity="0.25"/>
        <polygon points="60,47 60,61 76,54" fill="white" opacity="0.9"/>
        <!-- Ojo izquierdo -->
        <circle cx="46" cy="74" r="4" fill="black" opacity="0.35"/>
        <circle cx="46" cy="74" r="4" fill="white" opacity="0.7"/>
        <circle cx="47.5" cy="72.5" r="1.5" fill="black" opacity="0.8"/>
        <!-- Guiño derecho -->
        <path d="M80 72 Q84 69 88 72" stroke="black" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>
        <path d="M80 72 Q84 69 88 72" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
        <!-- Sonrisa -->
        <path d="M50 84 Q65 94 80 84" stroke="black" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>
        <path d="M50 84 Q65 94 80 84" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
      </svg>

      <div class="splash-logo">
        <span class="my">MY</span><span class="m2">M</span><span class="o1">O</span><span class="o2">O</span><span class="d">D</span>
      </div>
      <div class="splash-tag">Mirá lo que sentís</div>
    </div>
    <div class="splash-actions">
      <button class="btn btn-primary" onclick="goTo('quiz')">¿Qué vemos hoy? →</button>
      <button class="btn btn-ghost">Ya tengo cuenta</button>
    </div>
  </div>

  <!-- ── QUIZ ── -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-inner">
      <div class="topbar">
        <button class="btn-back" onclick="prevQ()">←</button>
        <button class="skip-btn" onclick="nextQ()">Saltar</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:20%"></div>
        </div>
        <div class="progress-label" id="progress-label">1 de 5</div>
      </div>
      <div class="q-num" id="q-num">Pregunta 1</div>
      <div class="q-text" id="q-text"></div>
      <div class="options-list" id="options-list"></div>
      <div class="quiz-footer">
        <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Siguiente →</button>
      </div>
    </div>
  </div>

  <!-- ── LOADING ── -->
  <div id="screen-loading" class="screen">
    <div class="loading-orb"></div>
    <div class="loading-text" id="loading-text">Analizando tu mood...</div>
    <div class="loading-sub">Buscando lo perfecto para hoy</div>
  </div>

  <!-- ── RESULTS ── -->
  <div id="screen-results" class="screen">
    <div class="results-header">
      <div class="res-eyebrow">Tu mood de hoy</div>
      <div class="res-mood-name" id="res-mood-name">—</div>
      <div class="res-subtitle" id="res-subtitle"></div>
      <div class="mood-tags" id="mood-tags"></div>
    </div>
    <div class="res-tabs">
      <button class="res-tab active" onclick="filterTab('all', this)">Todo</button>
      <button class="res-tab" onclick="filterTab('movie', this)">Películas</button>
      <button class="res-tab" onclick="filterTab('tv', this)">Series</button>
    </div>
    <div id="cards-container" class="cards-section"></div>
    <div class="results-footer">
      <button class="btn-regen" onclick="regenerate()">↺ Otras recomendaciones</button>
      <button class="btn-restart" onclick="restart()">Volver a empezar</button>
    </div>
  </div>

</div>

<script>
const TMDB_KEY = '2f2d9e3f9b8b9c6e0f1a5d7c8e4b6a3d'; // public demo key — reemplazar con la propia
const TMDB_BASE = 'https://api.themoviedb.org/3';
const COUNTRY = 'AR';

const questions = [
  {
    text: '¿Cómo llegaste a este momento del día?',
    options: [
      { icon: '😮‍💨', label: 'Agotado/a', desc: 'Sin energía, modo zombie', value: 'agotado' },
      { icon: '😌', label: 'Tranquilo/a', desc: 'Ni bien ni mal, en paz', value: 'tranquilo' },
      { icon: '⚡', label: 'Con energía', desc: 'Activo/a, listo/a para algo bueno', value: 'acelerado' },
      { icon: '🌧', label: 'Pensativo/a', desc: 'Con cosas dando vueltas', value: 'nostalgico' },
    ]
  },
  {
    text: '¿Qué necesitás que te deje la pantalla?',
    options: [
      { icon: '😂', label: 'Reírme', desc: 'Algo que me levante el ánimo', value: 'reir' },

let currentQ = 0;
const answers = {};
let allRecs = [];
let currentTab = 'all';
let moodData = null;

function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('q-num').textContent = `Pregunta ${currentQ + 1}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-fill').style.width = `${((currentQ + 1) / 5) * 100}%`;
  document.getElementById('progress-label').textContent = `${currentQ + 1} de 5`;

  const list = document.getElementById('options-list');
  list.innerHTML = q.options.map(opt => `
    <button class="opt-btn ${answers[currentQ] === opt.value ? 'selected' : ''}"
      onclick="selectOpt(${currentQ}, '${opt.value}', this)">
      <div class="opt-icon">${opt.icon}</div>
      <div class="opt-info">
        <span class="opt-label">${opt.label}</span>
        <span class="opt-desc">${opt.desc}</span>
      </div>
      <div class="opt-check">${answers[currentQ] === opt.value ? '✓' : ''}</div>
    </button>
  `).join('');

  const isLast = currentQ === questions.length - 1;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = isLast ? 'Ver mi mood ✦' : 'Siguiente →';
  nextBtn.disabled = answers[currentQ] === undefined;
}

function selectOpt(qIdx, value, el) {
  answers[qIdx] = value;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.classList.remove('selected');
    b.querySelector('.opt-check').textContent = '';
  });
  el.classList.add('selected');
  el.querySelector('.opt-check').textContent = '✓';
  document.getElementById('btn-next').disabled = false;
}

function nextQ() {
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    startAnalysis();
  }
}

function prevQ() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  } else {
    goTo('splash');
  }
}

async function startAnalysis() {
  goTo('loading');
  const msgs = ['Analizando tu mood...', 'Buscando lo perfecto...', 'Casi listo...'];
  let mi = 0;
  const interval = setInterval(() => {
    mi = (mi + 1) % msgs.length;
    const el = document.getElementById('loading-text');
    if (el) el.textContent = msgs[mi];
  }, 1800);

  try {
    await fetchRecommendations();
  } catch(e) {
    console.error(e);
  } finally {
    clearInterval(interval);
  }
}

// ── Generar instrucciones de contenido desde el mood ───────────────────
function buildContentInstructions(mood) {
  const { universo, compania, esfuerzo } = mood.filtros || {};
  const parts = [];

  if (universo === 'fantasia') parts.push('universo de fantasía o ciencia ficción');
  if (universo === 'real')     parts.push('ambientado en el mundo real, historias cotidianas o contemporáneas');
  if (universo === 'terror')   parts.push('terror, thriller psicológico o suspenso');
  if (universo === 'documental') parts.push('documental o basado en hechos reales');

  if (compania === 'pareja')  parts.push('apropiado para ver en pareja, con algo de romance o emoción compartida');
  if (compania === 'amigos')  parts.push('entretenido para grupo, accesible y sin demasiada carga emocional');
  if (compania === 'familia') parts.push('apto para toda la familia, sin violencia explícita ni contenido adulto');
  if (compania === 'solo')    parts.push('experiencia personal e íntima, podés ir a fondo emocionalmente');

  if (esfuerzo === 'full')    parts.push('narrativa compleja, con giros, profundidad y personajes bien construidos');
  if (esfuerzo === 'cero')    parts.push('trama simple y directa, que entre solo sin exigir atención sostenida');
  if (esfuerzo === 'visual')  parts.push('dirección y fotografía destacables, experiencia más visual que narrativa');

  return parts.length > 0 ? `Considerá además: ${parts.join('; ')}.` : '';
}

// ── FETCH CON MOOD PRE-DETECTADO ───────────────────────────────────────
async function fetchRecommendations(isRegen = false) {
  const mood = detectMood();
  const contentInstructions = buildContentInstructions(mood);

  const prevTitles = isRegen && allRecs.length
    ? `\nNO repitas estos títulos ya recomendados: ${allRecs.map(r => r.title).join(', ')}.`
    : '';

  const prompt = `Sos un experto en cine y series. El usuario tiene el siguiente estado emocional detectado:

MOOD: "${mood.nombre}"
DESCRIPCIÓN: ${mood.desc}
TAGS: ${mood.tags.join(', ')}
${contentInstructions}${prevTitles}

Tu tarea: recomendar exactamente 3 películas y 3 series que encajen perfectamente con este mood.
Las recomendaciones deben ser diversas entre sí (no 3 del mismo género/tono) para maximizar las chances de que el usuario elija una en el primer intento.

Respondé SOLO con JSON válido, sin texto extra, sin markdown, sin backticks:
{
  "mood": "${mood.nombre}",
  "mood_desc": "${mood.desc}",
  "tags": ${JSON.stringify(mood.tags)},
  "movies": [
    {"title":"título exacto en inglés o idioma original","year":"YYYY","genre":"género","why":"por qué encaja con este mood exacto, 12-15 palabras en español rioplatense"},
    {"title":"...","year":"...","genre":"...","why":"..."},
    {"title":"...","year":"...","genre":"...","why":"..."}
  ],
  "series": [
    {"title":"título exacto","year":"YYYY","genre":"género","why":"..."},
    {"title":"...","year":"...","genre":"...","why":"..."},
    {"title":"...","year":"...","genre":"...","why":"..."}
  ]
}
Usá títulos reales, conocidos y disponibles en plataformas de streaming. El título debe ser exacto para poder buscarlo en TMDb.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  const data = await res.json();
  const raw = data.content.map(b => b.text || '').join('');
  const clean = raw.replace(/```json|```/g, '').trim();
  moodData = JSON.parse(clean);

  document.getElementById('res-mood-name').textContent = moodData.mood;
  document.getElementById('res-subtitle').textContent = moodData.mood_desc;
  const tagsEl = document.getElementById('mood-tags');
  tagsEl.innerHTML = (moodData.tags || []).map(t => `<div class="mood-tag">${t}</div>`).join('');

  allRecs = [
    ...moodData.movies.map(m => ({ ...m, type: 'movie' })),
    ...moodData.series.map(s => ({ ...s, type: 'tv' }))
  ];

  renderCards(allRecs);
  goTo('results');

  // Fetch TMDb data for each rec in background
  allRecs.forEach((rec, idx) => fetchTMDb(rec, idx));
}

function renderCards(recs) {
  const container = document.getElementById('cards-container');
  const filtered = currentTab === 'all' ? recs : recs.filter(r => r.type === currentTab);

  if (filtered.length === 0) {
    container.innerHTML = '<p style="color:var(--text3);font-size:14px;padding:20px 0;">Sin resultados para este filtro.</p>';
    return;
  }

  container.innerHTML = filtered.map((rec, idx) => {
    const globalIdx = allRecs.indexOf(rec);
    return `
    <div class="rec-card" id="card-${globalIdx}">
      <div class="rec-card-top">
        <div class="rec-poster" id="poster-${globalIdx}">
          ${rec.posterEmoji || (rec.type === 'movie' ? '🎬' : '📺')}
        </div>
        <div class="rec-body">
          <div class="rec-type">${rec.type === 'movie' ? 'Película' : 'Serie'} · ${rec.genre}</div>
          <div class="rec-title">${rec.title}</div>
          <div class="rec-meta">${rec.year}${rec.rating ? ' · ★ ' + rec.rating : ''}</div>
          <div class="rec-why">"${rec.why}"</div>
        </div>
      </div>
      <div class="rec-card-bottom">
        <div class="platform-badges" id="platforms-${globalIdx}">
          <div class="platform-badge loading-badge skeleton" style="width:70px;height:24px;"></div>
        </div>
        <button class="btn-watch" onclick="watchThis('${rec.title}', ${globalIdx})">Ver ahora ↗</button>
      </div>
    </div>`;
  }).join('');
}

async function fetchTMDb(rec, idx) {
  try {
    const type = rec.type;
    const searchEndpoint = type === 'movie'
      ? `${TMDB_BASE}/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(rec.title)}&year=${rec.year}&language=es-AR`
      : `${TMDB_BASE}/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(rec.title)}&language=es-AR`;

    const searchRes = await fetch(searchEndpoint);
    const searchData = await searchRes.json();
    const item = searchData.results?.[0];
    if (!item) return;

    // Update rating
    if (item.vote_average) {
      allRecs[idx].rating = item.vote_average.toFixed(1);
      const metaEl = document.querySelector(`#card-${idx} .rec-meta`);
      if (metaEl) metaEl.textContent = `${rec.year} · ★ ${item.vote_average.toFixed(1)}`;
    }

    // Update poster
    if (item.poster_path) {
      const posterEl = document.getElementById(`poster-${idx}`);
      if (posterEl) {
        posterEl.innerHTML = `<img src="https://image.tmdb.org/t/p/w200${item.poster_path}" alt="${rec.title}">`;
      }
    }

    // Fetch watch providers
    const provRes = await fetch(
      `${TMDB_BASE}/${type}/${item.id}/watch/providers?api_key=${TMDB_KEY}`
    );
    const provData = await provRes.json();
    const arProviders = provData.results?.[COUNTRY];

    const platformsEl = document.getElementById(`platforms-${idx}`);
    if (!platformsEl) return;

    const providers = [
      ...(arProviders?.flatrate || []),
      ...(arProviders?.free || []),
    ];

    if (providers.length === 0) {
      platformsEl.innerHTML = '<div class="platform-badge">No disponible en AR</div>';
    } else {
      const seen = new Set();
      const badges = providers
        .filter(p => { if (seen.has(p.provider_id)) return false; seen.add(p.provider_id); return true; })
        .slice(0, 3)
        .map(p => `<div class="platform-badge">${p.provider_name.replace(' Amazon Channel','').replace(' with Ads','')}</div>`)
        .join('');
      platformsEl.innerHTML = badges;
    }

    // Store tmdb link
    allRecs[idx].tmdbId = item.id;
    allRecs[idx].tmdbLink = `https://www.themoviedb.org/${type}/${item.id}`;

  } catch(e) {
    const platformsEl = document.getElementById(`platforms-${idx}`);
    if (platformsEl) platformsEl.innerHTML = '<div class="platform-badge">—</div>';
  }
}

function watchThis(title, idx) {
  const rec = allRecs[idx];
  if (rec?.tmdbLink) {
    window.open(rec.tmdbLink, '_blank');
  } else {
    window.open(`https://www.google.com/search?q=${encodeURIComponent(title + ' ver online')}`, '_blank');
  }
}

function filterTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.res-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderCards(allRecs);
  // Re-fetch TMDb for newly rendered cards
  allRecs.forEach((rec, idx) => {
    const platformsEl = document.getElementById(`platforms-${idx}`);
    if (platformsEl && platformsEl.querySelector('.skeleton')) {
      fetchTMDb(rec, idx);
    }
  });
}

async function regenerate() {
  goTo('loading');
  try {
    await fetchRecommendations(true);
  } catch(e) {
    goTo('results');
    const container = document.getElementById('cards-container');
    container.innerHTML = '<div class="error-msg">No se pudieron cargar nuevas recomendaciones. Intentá de nuevo.</div>';
  }
}

function restart() {
  currentQ = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  allRecs = [];
  moodData = null;
  currentTab = 'all';
  renderQuestion();
  goTo('splash');
}

// Init
renderQuestion();
